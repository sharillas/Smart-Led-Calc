<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart LED Calc — Diagrama de Montagem (protótipo multi-secção)</title>
<link rel="stylesheet" href="src/vendor/inter.css">
<script src="src/vendor/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #121110; --panel: #1A1815; --panel2: #14120E; --line: #2E2B25; --line2: #38342D;
    --ink: #E7E2D6; --ink2: #9C9484; --ink3: #6E675A;
    --amber: #E3A857; --amber-dim: rgba(227,168,87,0.14); --green: #8FAE8B; --red: #C96A5A;
    --mono: 'Cascadia Mono', Consolas, 'Courier New', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 400;
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(231,226,214,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(231,226,214,0.018) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink); padding: 22px 26px;
  }
  .header { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 2px solid var(--line); }
  .header img { height: 40px; }
  .header h1 { font-family: var(--mono); font-size: 1.25rem; font-weight: 500; letter-spacing: 0.04em; }
  .header .sub { font-family: var(--mono); color: var(--ink3); font-size: 0.76rem; margin-top: 4px; letter-spacing: 0.06em; }
  .header .meta { margin-left: auto; text-align: right; font-family: var(--mono); font-size: 0.72rem; color: var(--ink3); line-height: 1.5; letter-spacing: 0.05em; }
  .header .meta .rev { color: var(--amber); border: 1px solid rgba(227,168,87,0.4); padding: 2px 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; margin-bottom: 14px; }
  .toolbar { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-family: var(--mono); font-size: 0.66rem; font-weight: 500; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.12em; }
  .field input, .field select {
    background: var(--panel2); border: 1px solid var(--line2); color: var(--ink);
    padding: 8px 10px; border-radius: 3px; font-size: 0.9rem; font-family: var(--mono); outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--amber); }
  .seg { display: flex; border: 1px solid var(--line2); border-radius: 3px; padding: 2px; gap: 2px; }
  .seg button {
    border: none; background: transparent; color: var(--ink2);
    padding: 7px 12px; border-radius: 2px; cursor: pointer; font-weight: 500;
    font-size: 0.72rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; transition: all .12s;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.on-sig { background: var(--amber-dim); color: var(--amber); }
  .seg button.on-pwr { background: rgba(143,174,139,0.14); color: var(--green); }
  .seg button.on-both { background: rgba(231,226,214,0.1); color: var(--ink); }
  .seg button.on-neutral { background: var(--line2); color: var(--ink); }
  .zbtn {
    background: var(--panel2); border: 1px solid var(--line2); color: var(--ink);
    width: 30px; height: 30px; border-radius: 3px; cursor: pointer;
    font-family: var(--mono); font-size: 1rem; line-height: 1; transition: all .12s;
  }
  .zbtn:hover { border-color: var(--amber); color: var(--amber); }
  .sec-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .sec-row:last-child { border-bottom: none; }
  .sec-row .sidx { font-family: var(--mono); font-size: 0.72rem; color: var(--ink3); width: 46px; letter-spacing: 0.06em; }
  .sec-row input { width: 74px; }
  .sec-row .x { color: var(--ink3); font-family: var(--mono); font-size: 0.8rem; }
  .sec-row .sinfo { font-family: var(--mono); font-size: 0.68rem; color: var(--ink3); letter-spacing: 0.04em; }
  .sec-del { background: transparent; border: 1px solid var(--line2); color: var(--red); width: 26px; height: 26px; border-radius: 3px; cursor: pointer; font-size: 0.9rem; }
  .sec-del:hover { border-color: var(--red); }
  .btn-add, .btn-preset {
    font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--amber); background: transparent; border: 1px solid rgba(227,168,87,0.45);
    padding: 8px 14px; border-radius: 3px; cursor: pointer; margin-right: 8px; margin-top: 10px; transition: all .12s;
  }
  .btn-add:hover, .btn-preset:hover { background: var(--amber-dim); }
  .cells { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .cell { display: flex; flex-direction: column; gap: 3px; min-width: 96px; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 7px 12px; }
  .cell .k { font-family: var(--mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink3); }
  .cell .v { font-family: var(--mono); font-size: 0.94rem; color: var(--ink); line-height: 1.25; }
  .cell.a .v { color: var(--amber); }
  .cell.g .v { color: var(--green); }
  .cell.r .v { color: var(--red); }
  canvas { width: 100%; border-radius: 4px; background: #443D32; border: 1px solid var(--line); display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-top: 12px; font-family: var(--mono); font-size: 0.8rem; color: var(--ink2); letter-spacing: 0.03em; }
  .sw { display: inline-block; width: 10px; height: 10px; border: 1px solid rgba(231,226,214,0.35); margin-right: 6px; vertical-align: -1px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .section-title { font-family: var(--mono); font-size: 0.86rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink); }
  .section-title::before { content: '▮'; color: var(--amber); margin-right: 8px; }
  .btn-pdf { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--amber); background: transparent; border: 1px solid rgba(227,168,87,0.45); padding: 8px 14px; border-radius: 3px; cursor: pointer; transition: all .12s; }
  .btn-pdf:hover { background: var(--amber-dim); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 10px; color: var(--ink3); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 0.64rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); color: var(--ink2); font-size: 0.95rem; }
  td.n { color: var(--ink); }
  td.q { font-family: var(--mono); font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tag { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; padding: 2px 7px; border-radius: 2px; }
  .tag.est { color: #B8B09E; border: 1px solid rgba(184,176,158,0.4); }
  .tag.sig { color: var(--amber); border: 1px solid rgba(227,168,87,0.4); }
  .tag.pwr { color: var(--green); border: 1px solid rgba(143,174,139,0.4); }
  .tag.dis { color: #A99BB8; border: 1px solid rgba(169,155,184,0.4); }
  .footer { text-align: center; margin-top: 22px; padding: 14px 0 6px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.06em; color: var(--ink3); }
</style>
</head>
<body>

  <div class="header">
    <img src="src/logo.svg" alt="logo">
    <div>
      <h1>DIAGRAMA DE MONTAGEM</h1>
      <div class="sub">SMARTCHOICE LED CALCULATOR · SINAL / POWER · MULTI-SECÇÃO</div>
    </div>
    <div class="meta">
      <div>REV <span class="rev">2.0-PROTO</span></div>
      <div>NÃO INTEGRADO NA APP</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head" style="margin-bottom:4px;">
      <h2 class="section-title">Configuração do Wall</h2>
    </div>
    <div id="sectionsEditor"></div>
    <div>
      <button class="btn-add" onclick="addSection()">+ Adicionar secção</button>
      <button class="btn-preset" onclick="loadPreset('simples')">Wall único 20×3</button>
      <button class="btn-preset" onclick="loadPreset('composto')">Exemplo composto (5 secções)</button>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="field"><label>Marca</label>
        <select id="brand">
          <option value="unillumin">Unillumin UPADIII · 160W · 6/cx</option>
          <option value="omegapix">Prolight Omegapix 26B · 160W · 8/cx</option>
          <option value="reto" selected>Traulux T-Rent Reto · 210W · 8/cx</option>
          <option value="flex">Traulux T-Rent FLEX · 210W · 8/cx</option>
        </select>
      </div>
      <div class="field"><label>Controladora</label>
        <select id="ctrl">
          <option value="mctrl4k" selected>NovaStar MCTRL 4K · 16 portas</option>
          <option value="mx40pro">NovaStar MX40 PRO · 20 portas</option>
          <option value="r5">NovaStar MCTRL R5 · 8 portas</option>
        </select>
      </div>
      <div class="field"><label>Redundância</label>
        <label style="display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:0.72rem;color:var(--ink2);cursor:pointer;padding:8px 0;">
          <input type="checkbox" id="redun"> 100% (main + backup)
        </label>
      </div>
      <div class="field"><label>Zoom</label>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="zbtn" onclick="zoomBy(0.8)" title="Reduzir zoom">−</button>
          <input type="range" id="zoom" min="0.25" max="6" step="0.05" value="1" style="width:110px" title="Zoom — arrasta no diagrama para deslocar">
          <button class="zbtn" onclick="zoomBy(1.25)" title="Aumentar zoom">+</button>
        </div>
      </div>
      <div class="field"><label>Vista</label>
        <div class="seg">
          <button id="btnSig" onclick="setLayer('sig')">Sinal</button>
          <button id="btnPwr" onclick="setLayer('pwr')">Power</button>
          <button id="btnBoth" onclick="setLayer('both')">Ambos</button>
        </div>
      </div>
      <div class="field"><label>Detalhe</label>
        <div class="seg">
          <button id="btnSimp" onclick="setDetail('simples')">Simples</button>
          <button id="btnComp" onclick="setDetail('completo')">Setas</button>
          <button id="btnCab" onclick="setDetail('cabos')">Cabos</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="cells" id="chips"></div>
    <canvas id="cv" width="1600" height="720"></canvas>
    <div class="legend" id="legend"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2 class="section-title">Lista de Material — Picking List</h2>
      <button class="btn-pdf" onclick="generatePDF()">Exportar PDF (lista + sinal + power)</button>
    </div>
    <table>
      <thead><tr><th style="width:56px">Tipo</th><th>Item</th><th style="width:150px">Quantidade</th><th>Descrição / Regra</th></tr></thead>
      <tbody id="bom"></tbody>
    </table>
  </div>

  <div class="footer">Copyright©2026 — All Rights Reserved — Nelson Teixeira</div>

<script>
// ---- REGRAS ----
const CFG = {
  tilesPerPortCap: 16,
  tilesPerChainPwrCap: 16,
  circuitsPerSocapex: 6,
  stackEveryCols: 3,
  pesosPerMeter: 2,
  garrasPerStack: 2,
  quadroOptions: [32, 63, 125], marginQuadro: 0.8,
  gapTiles: 1
};

const CONTROLLERS = {
  mctrl4k: { name: 'MCTRL 4K', ports: 16, maxTiles: 128 },
  mx40pro: { name: 'MX40 PRO', ports: 20, maxTiles: 160 },
  r5:      { name: 'MCTRL R5', ports: 8,  maxTiles: 64 }
};

const BRANDS = {
  unillumin: { name: 'Unillumin UPADIII', power: 160, perBox: 6 },
  omegapix:  { name: 'Prolight Omegapix 26B', power: 160, perBox: 8 },
  reto:      { name: 'Traulux T-Rent Reto', power: 210, perBox: 8 },
  flex:      { name: 'Traulux T-Rent FLEX', power: 210, perBox: 8 }
};

const PAL = [
  '#7dd3fc','#fca5a5','#86efac','#fcd34d','#c4b5fd','#67e8f9',
  '#f9a8d4','#bef264','#fdba74','#a5b4fc','#5eead4','#fde68a',
  '#d8b4fe','#99f6e4','#fecaca','#bfdbfe'
];

let sections = [{ w: 20, h: 3 }];
let layer = 'sig';
let detail = 'simples';
let zoom = 1;
let panX = 0, panY = 0;

function setLayer(l) {
  layer = l;
  const m = { sig: 'on-sig', pwr: 'on-pwr', both: 'on-both' };
  ['btnSig','btnPwr','btnBoth'].forEach(id => document.getElementById(id).className = '');
  document.getElementById({ sig:'btnSig', pwr:'btnPwr', both:'btnBoth' }[l]).className = m[l];
  draw();
}
function setDetail(d) {
  detail = d;
  ['btnSimp','btnComp','btnCab'].forEach(id => document.getElementById(id).className = '');
  document.getElementById({ simples:'btnSimp', completo:'btnComp', cabos:'btnCab' }[d]).className = 'on-neutral';
  draw();
}
function zoomBy(f) {
  zoom = Math.min(6, Math.max(0.25, zoom * f));
  document.getElementById('zoom').value = zoom;
  draw();
}
function loadPreset(k) {
  if (k === 'simples') sections = [{ w: 20, h: 3 }];
  else sections = [{ w: 1, h: 3 }, { w: 2, h: 4 }, { w: 8, h: 4.5 }, { w: 2, h: 4 }, { w: 1, h: 3 }];
  zoom = 1; panX = 0; panY = 0;
  document.getElementById('zoom').value = 1;
  renderSections();
  draw();
}
function addSection() {
  sections.push({ w: 2, h: 3 });
  renderSections();
  draw();
}
function removeSection(i) {
  if (sections.length <= 1) { sections = [{ w: 5, h: 3 }]; }
  else sections.splice(i, 1);
  renderSections();
  draw();
}
function renderSections() {
  const el = document.getElementById('sectionsEditor');
  el.innerHTML = sections.map((s, i) => {
    const tw = Math.ceil((Math.max(0.5, s.w || 1) * 1000) / 500);
    const th = Math.ceil((Math.max(0.5, s.h || 1) * 1000) / 500);
    return '<div class="sec-row">' +
      '<span class="sidx">SEC ' + (i + 1) + '</span>' +
      '<label class="x">L</label><input type="number" step="0.1" min="0.5" value="' + s.w + '" onchange="editSection(' + i + ',\'w\',this.value)">' +
      '<label class="x">× A</label><input type="number" step="0.1" min="0.5" value="' + s.h + '" onchange="editSection(' + i + ',\'h\',this.value)">' +
      '<span class="x">m</span>' +
      '<span class="sinfo">' + tw + ' × ' + th + ' tiles · ' + (tw * th) + ' un</span>' +
      '<button class="sec-del" onclick="removeSection(' + i + ')" title="Remover secção">✕</button>' +
      '</div>';
  }).join('');
}
function editSection(i, k, v) {
  const n = parseFloat(v);
  sections[i][k] = isNaN(n) ? 0.5 : Math.max(0.5, n);
  renderSections();
  draw();
}

// circuito de sinal: colunas completas (preferência 2 colunas)
function signalChainTiles(th) {
  let cols = Math.floor(CFG.tilesPerPortCap / th);
  if (cols < 2 && th >= 9) cols = 2;
  if (cols < 1) cols = 1;
  return cols * th;
}

// circuito de power: escolher o tamanho que melhor equilibra as 3 fases (simulação gulosa)
function powerChainTiles(tt, cap, wattsPerTile) {
  const ideal = tt * wattsPerTile / 230 / 3;
  const thresh = Math.max(1.5, ideal * 0.05); // tolerância: 5% do ideal, mín. 1.5A
  let best = { T: cap, spread: Infinity };
  for (let T = cap; T >= 1; T--) {
    const chains = Math.ceil(tt / T);
    const loads = [];
    for (let c = 0; c < chains; c++) {
      loads.push(Math.max(0, Math.min(T, tt - c * T)) * wattsPerTile / 230);
    }
    const ph = [0, 0, 0];
    loads.slice().sort((a, b) => b - a).forEach(a => { ph.sort((x, y) => x - y)[0] += a; });
    const spread = Math.max(...ph) - Math.min(...ph);
    if (spread <= thresh) return T; // primeiro (maior) T aceitável
    if (spread < best.spread - 1e-9) best = { T, spread };
  }
  return best.T;
}

function compute() {
  const brand = BRANDS[document.getElementById('brand').value] || BRANDS.reto;
  const redun = document.getElementById('redun').checked;
  const ctrl = CONTROLLERS[document.getElementById('ctrl').value];

  const secs = sections.map((s) => {
    const w = Math.max(0.5, s.w || 1), h = Math.max(0.5, s.h || 1);
    const tw = Math.ceil(w * 1000 / 500), th = Math.ceil(h * 1000 / 500), tt = tw * th;
    const perSig = Math.min(signalChainTiles(th), tt);
    const chains = Math.ceil(tt / perSig);
    const stackCols = Math.max(1, Math.ceil(tw / CFG.stackEveryCols));
    const stackRows = Math.max(1, Math.ceil(h));
    const stacks = stackCols * stackRows;
    return {
      w, h, tw, th, tt, perSig, chains,
      watts: tt * brand.power,
      stacks,
      pesosCount: stackCols * CFG.pesosPerMeter * stackRows,
      frames: tw,
      garras: stacks * CFG.garrasPerStack,
      caixas: Math.ceil(tt / brand.perBox)
    };
  });

  // circuito de power: igual ao circuito de sinal (mesma quantidade de tiles)
  const tt = secs.reduce((a, s) => a + s.tt, 0);
  secs.forEach(s => {
    s.perPwr = Math.min(s.perSig, s.tt);
    s.chainsPwr = Math.ceil(s.tt / s.perPwr);
  });
  const maxCircuitAmps = Math.max(...secs.map(s => s.perPwr * brand.power / 230));
  const warnOver16 = maxCircuitAmps > 16 + 1e-6;

  const chainsMain = secs.reduce((a, s) => a + s.chains, 0);
  const portsMain = chainsMain;
  const portsBackup = redun ? chainsMain : 0;
  const portsTotal = portsMain + portsBackup;

  let units = Math.max(1, Math.ceil(portsTotal / ctrl.ports), Math.ceil(tt / ctrl.maxTiles));
  let chainsPerUnit;
  for (;;) {
    const base = Math.floor(chainsMain / units);
    const rem = chainsMain % units;
    const arr = [];
    for (let i = 0; i < units; i++) arr.push(base + (i < rem ? 1 : 0));
    if (arr.every(n => (redun ? 2 * n : n) <= ctrl.ports)) { chainsPerUnit = arr; break; }
    units++;
  }
  const capacityWarn = tt > units * ctrl.maxTiles;

  // comprimento em tiles de cada circuito (global)
  const chainTiles = [];
  secs.forEach(s => { for (let c = 0; c < s.chains; c++) chainTiles.push(Math.max(0, Math.min(s.perSig, s.tt - c * s.perSig))); });
  // mapa circuito global -> secção (para o canvas)
  const chainSec = [];
  secs.forEach((s, si) => { for (let c = 0; c < s.chains; c++) chainSec.push(si); });

  const tilesPerUnit = [];
  let idx = 0;
  for (let u = 0; u < units; u++) {
    let t = 0;
    for (let i = 0; i < chainsPerUnit[u]; i++) { t += chainTiles[idx]; idx++; }
    tilesPerUnit.push(t);
  }

  const chainsPwr = secs.reduce((a, s) => a + s.chainsPwr, 0);
  const socapex = Math.ceil(chainsPwr / CFG.circuitsPerSocapex);
  const polvos = socapex;
  const watts = secs.reduce((a, s) => a + s.watts, 0);
  const ampsTotal = watts / 230;

  // ---- fase 1: distribuir circuitos pelas fases (mínima carga, capacidade 2×socapex por fase) ----
  const pwrCircuits = [];
  secs.forEach((s, si) => {
    for (let c = 0; c < s.chainsPwr; c++) {
      const tiles = Math.max(0, Math.min(s.perPwr, s.tt - c * s.perPwr));
      const wattsC = tiles * brand.power;
      pwrCircuits.push({ si, c, tiles, amps: wattsC / 230 });
    }
  });
  const phaseLoads = [0, 0, 0];
  const phaseCount = [0, 0, 0];
  const assign = pwrCircuits.map(() => ({ polvo: -1, phase: -1 }));
  const sortedIdx = pwrCircuits.map((_, i) => i).sort((a, b) => pwrCircuits[b].amps - pwrCircuits[a].amps);
  sortedIdx.forEach(ci => {
    const ph = [0, 1, 2]
      .filter(p => phaseCount[p] < 2 * socapex)
      .sort((a, b) => phaseLoads[a] - phaseLoads[b])[0];
    phaseCount[ph]++;
    phaseLoads[ph] += pwrCircuits[ci].amps;
    assign[ci].phase = ph;
  });

  // ---- fase 2: encher os polvos (máx. 2 CE por fase por polvo, ~5 CE por polvo) ----
  const target = Math.ceil(pwrCircuits.length / socapex);
  const pool = [[], [], []];
  assign.forEach((a, ci) => pool[a.phase].push(ci));
  for (let p = 0; p < socapex; p++) {
    let filled = 0;
    const phOrder = [0, 1, 2].sort((x, y) => pool[y].length - pool[x].length);
    for (const ph of phOrder) {
      const n = Math.min(2, pool[ph].length, target - filled);
      for (let k = 0; k < n; k++) {
        const ci = pool[ph].shift();
        assign[ci].polvo = p;
        filled++;
      }
    }
  }
  // sobras (quando 2 CE/fase/polvo não chega): distribuir pelos polvos com espaço
  let pOver = 0;
  [0, 1, 2].forEach(ph => {
    while (pool[ph].length) {
      const ci = pool[ph].shift();
      assign[ci].polvo = pOver % socapex;
      pOver++;
    }
  });

  // ---- fase 3: slot CE dentro do polvo (ordenado por fase: L1 primeiro, depois L2, L3) ----
  for (let p = 0; p < socapex; p++) {
    const cs = [];
    assign.forEach((a, ci) => { if (a.polvo === p) cs.push(ci); });
    cs.sort((x, y) => assign[x].phase - assign[y].phase || x - y);
    cs.forEach((ci, i) => { assign[ci].slot = i + 1; });
  }
  const maxPhaseAmps = Math.max(...phaseLoads);
  let quadro = CFG.quadroOptions.find(q => q * CFG.marginQuadro >= maxPhaseAmps) || null;

  const totals = {
    frames: secs.reduce((a, s) => a + s.frames, 0),
    stacks: secs.reduce((a, s) => a + s.stacks, 0),
    pesosCount: secs.reduce((a, s) => a + s.pesosCount, 0),
    garras: secs.reduce((a, s) => a + s.garras, 0),
    caixas: secs.reduce((a, s) => a + s.caixas, 0)
  };
  const maxTh = Math.max(...secs.map(s => s.th));
  const totalTw = secs.reduce((a, s) => a + s.tw, 0) + CFG.gapTiles * (secs.length - 1);

  return { secs, tt, chainsMain, chainTiles, chainSec, portsMain, portsBackup, portsTotal,
           units, chainsPerUnit, tilesPerUnit, ctrl, capacityWarn, chainsPwr, socapex, polvos,
           watts, ampsTotal, phaseLoads, maxPhaseAmps, assign, quadro, totals, redun, brand, maxTh, totalTw,
           maxCircuitAmps, warnOver16 };
}

// cablagem: serpentina por colunas — coluna par: baixo→cima · coluna ímpar: cima→baixo
function wiringOrder(tw, th) {
  const pos = [];
  for (let i = 0; i < tw * th; i++) {
    const col = Math.floor(i / th);
    const r = i % th;
    const row = (col % 2 === 0) ? (th - 1 - r) : r;
    pos.push({ row, col });
  }
  return pos;
}

// altura do fluxo de distribuição power (QUADRO em cima + filas SOCA→POLVO→CE×6 empilhadas)
function powerFlowHeight(d) {
  return 82 + d.socapex * 40 + 24;
}

function col(c) { return PAL[c % PAL.length]; }

function draw() {
  const d = compute();
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = 'rgba(231,226,214,0.03)';
  ctx.lineWidth = 1;
  for (let gx = 0; gx < cv.width; gx += 26) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, cv.height); ctx.stroke(); }
  for (let gy = 0; gy < cv.height; gy += 26) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(cv.width, gy); ctx.stroke(); }

  ctx.save();
  ctx.translate(cv.width / 2 + panX, cv.height / 2 + panY);
  ctx.scale(zoom, zoom);
  ctx.translate(-cv.width / 2, -cv.height / 2);

  if (layer === 'both') {
    ctx.strokeStyle = '#4A443A'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(800, 20); ctx.lineTo(800, 620); ctx.stroke();
    drawHalf(ctx, d, 0, 798, 'sig');
    drawHalf(ctx, d, 802, 1600, 'pwr');
  } else if (layer === 'sig') {
    drawHalf(ctx, d, 0, 1600, 'sig');
  } else {
    drawHalf(ctx, d, 0, 1600, 'pwr');
  }

  ctx.restore();

  buildChips(d);
  buildLegend(d);
  buildBom(d);
}

function drawHalf(ctx, d, x0, x1, type) {
  const H = 720;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, H); ctx.clip();

  const halfPorts = d.ctrl.ports / 2;
  const gridW = halfPorts * 15;
  const unitW = gridW + 44, unitH = 78, gapU = 10;
  const unitsPerRow = Math.max(1, Math.floor((x1 - x0 - 40) / (unitW + gapU)));
  const rowsU = Math.ceil(d.units / unitsPerRow);

  let wallLeft, wallRight, bottomReserve;
  if (type === 'sig') {
    wallLeft = x0 + 40; wallRight = x1 - 40;
    bottomReserve = rowsU * (unitH + gapU) + 30;
  } else {
    wallLeft = x0 + 40; wallRight = x1 - 40;
    bottomReserve = powerFlowHeight(d);
  }
  const top = 84;
  const tilePx = Math.min(34, (wallRight - wallLeft) / d.totalTw, (H - top - bottomReserve) / d.maxTh);
  const wx = wallLeft, wy = top;
  const hPx = d.maxTh * tilePx;
  const wallMidY = top + hPx / 2;

  ctx.textAlign = 'left';
  ctx.fillStyle = type === 'sig' ? '#E3A857' : '#8FAE8B';
  ctx.font = '500 18px Consolas';
  ctx.fillText(type === 'sig' ? 'SINAL' : 'POWER', x0 + 24, 32);
  ctx.fillStyle = '#6E675A';
  ctx.font = '400 13.5px Consolas';
  ctx.fillText(type === 'sig'
    ? d.portsMain + ' main + ' + d.portsBackup + ' backup · ' + d.units + '× ' + d.ctrl.name + ' · ' + d.tilesPerUnit.join('/') + ' tiles'
    : d.chainsPwr + ' circuitos CE · ' + d.socapex + ' socapex · ' + d.polvos + ' polvos · quadro ' + (d.quadro ? d.quadro + 'A' : '>125A'), x0 + 24, 46);

  // posições das secções (alinhadas pela base)
  const secLayout = [];
  let accX = 0;
  d.secs.forEach((s, si) => {
    secLayout.push({
      si,
      x: wx + accX * tilePx,
      y: wy + (d.maxTh - s.th) * tilePx,
      w: s.tw * tilePx,
      h: s.th * tilePx,
      tw: s.tw, th: s.th
    });
    accX += s.tw + CFG.gapTiles;
  });
  const chainsOffsetSig = [];
  const chainsOffsetPwr = [];
  let accC = 0, accP = 0;
  d.secs.forEach(s => { chainsOffsetSig.push(accC); accC += s.chains; chainsOffsetPwr.push(accP); accP += s.chainsPwr; });

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // --- secções: tiles, circuitos, marcadores ---
  d.secs.forEach((s, si) => {
    const L = secLayout[si];
    const pos = wiringOrder(s.tw, s.th);
    // moldura
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(L.x - 8, L.y - 8, L.w + 16, L.h + 16);
    ctx.strokeStyle = 'rgba(201,106,90,0.55)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(L.x - 8 + 0.5, L.y - 8 + 0.5, L.w + 15, L.h + 15);
    // etiqueta da secção
    ctx.fillStyle = '#9C9484';
    ctx.font = '500 11px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText('S' + (si + 1) + ' · ' + s.w + 'm × ' + s.h + 'm · ' + s.tt + ' tiles', L.x + L.w / 2, L.y - 16);

    // tiles
    const per = type === 'sig' ? s.perSig : s.perPwr;
    const nSecChains = type === 'sig' ? s.chains : s.chainsPwr;
    const offs = type === 'sig' ? chainsOffsetSig : chainsOffsetPwr;
    for (let i = 0; i < s.tt; i++) {
      const p = pos[i];
      const x = L.x + p.col * tilePx, y = L.y + p.row * tilePx;
      const gChain = offs[si] + Math.floor(i / per);
      ctx.fillStyle = col(gChain);
      ctx.globalAlpha = 0.88;
      ctx.fillRect(x + 1, y + 1, tilePx - 2, tilePx - 2);
      ctx.globalAlpha = 1;
      ctx.font = '500 ' + Math.max(9, Math.min(14, tilePx * 0.62)) + 'px Consolas';
      ctx.fillStyle = '#1A1815';
      ctx.fillText(String(gChain + 1), x + tilePx / 2, y + tilePx / 2 + 0.5);
    }

    // circuito: linha + setas + início/fim
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let c = 0; c < nSecChains; c++) {
      const start = c * per;
      const end = Math.min(start + per, s.tt);
      const startC = L.x + pos[start].col * tilePx + tilePx / 2;
      const startY = L.y + pos[start].row * tilePx + tilePx / 2;
      ctx.beginPath();
      ctx.moveTo(startC, startY);
      for (let i = start + 1; i < end; i++) {
        ctx.lineTo(L.x + pos[i].col * tilePx + tilePx / 2, L.y + pos[i].row * tilePx + tilePx / 2);
      }
      ctx.strokeStyle = 'rgba(26,24,21,0.3)';
      ctx.lineWidth = 2.2;
      ctx.stroke();
      circleMarker(ctx, startC, startY, tilePx);
      if (type === 'sig' && d.redun) {
        const e = end - 1;
        circleMarker(ctx, L.x + pos[e].col * tilePx + tilePx / 2, L.y + pos[e].row * tilePx + tilePx / 2, tilePx);
      }
      if (detail !== 'simples') {
        for (let i = start; i < end - 1; i++) {
          const ax = L.x + pos[i].col * tilePx + tilePx / 2, ay = L.y + pos[i].row * tilePx + tilePx / 2;
          const bx = L.x + pos[i + 1].col * tilePx + tilePx / 2, by = L.y + pos[i + 1].row * tilePx + tilePx / 2;
          const mx = (ax + bx) / 2, my = (ay + by) / 2;
          const ang = Math.atan2(by - ay, bx - ax);
          const ss = Math.max(3, tilePx * 0.2);
          ctx.fillStyle = 'rgba(26,24,21,0.55)';
          ctx.beginPath();
          ctx.moveTo(mx + Math.cos(ang) * ss, my + Math.sin(ang) * ss);
          ctx.lineTo(mx - Math.cos(ang - 0.5) * ss, my - Math.sin(ang - 0.5) * ss);
          ctx.lineTo(mx - Math.cos(ang + 0.5) * ss, my - Math.sin(ang + 0.5) * ss);
          ctx.closePath();
          ctx.fill();
        }
      }
    }
  });

  // cabos/equipamentos por tipo
  if (type === 'sig') {
    const chainStart = [];
    let acc = 0;
    for (let u = 0; u < d.units; u++) { chainStart.push(acc); acc += d.chainsPerUnit[u]; }
    // controladoras por baixo
    for (let u = 0; u < d.units; u++) {
      const row = Math.floor(u / unitsPerRow);
      const rowUnits = Math.min(unitsPerRow, d.units - row * unitsPerRow);
      const rowW = rowUnits * (unitW + gapU) - gapU;
      const ux = (x0 + x1) / 2 - rowW / 2 + (u % unitsPerRow) * (unitW + gapU);
      const uy = wy + hPx + 30 + row * (unitH + gapU);
      ctx.fillStyle = '#1B1915';
      ctx.fillRect(ux, uy, unitW, unitH);
      ctx.strokeStyle = '#38342D'; ctx.lineWidth = 1; ctx.strokeRect(ux + 0.5, uy + 0.5, unitW - 1, unitH - 1);
      ctx.fillStyle = '#E7E2D6'; ctx.font = '500 11.5px Consolas'; ctx.textAlign = 'center';
      ctx.fillText(d.ctrl.name + ' · ' + (u + 1), ux + unitW / 2, uy + 15);
      ctx.fillStyle = '#6E675A'; ctx.font = '500 10px Consolas';
      ctx.fillText(d.chainsPerUnit[u] + ' circuitos · ' + d.tilesPerUnit[u] + ' tiles', ux + unitW / 2, uy + 29);
      ctx.strokeStyle = '#38342D';
      ctx.beginPath(); ctx.moveTo(ux + 12, uy + 34); ctx.lineTo(ux + unitW - 12, uy + 34); ctx.stroke();
      if (d.redun) {
        ctx.fillStyle = '#6E675A'; ctx.font = '500 10px Consolas'; ctx.textAlign = 'right';
        ctx.fillText('MAIN', ux + unitW / 2 - gridW / 2 - 6, uy + 44.5);
        ctx.fillText('BKUP', ux + unitW / 2 - gridW / 2 - 6, uy + 60.5);
      }
      for (let i = 0; i < halfPorts; i++) {
        const px = ux + unitW / 2 - gridW / 2 + 7.5 + i * 15;
        const chainIdx = chainStart[u] + i;
        const used = i < d.chainsPerUnit[u];
        drawPort(ctx, px, uy + 44, used ? col(chainIdx) : '#14120E', used ? chainIdx + 1 : 0);
        if (d.redun) {
          drawPort(ctx, px, uy + 60, used ? col(chainIdx) : '#14120E', used ? chainIdx + 1 : 0);
        } else {
          const chainIdx2 = chainStart[u] + halfPorts + i;
          const used2 = (halfPorts + i) < d.chainsPerUnit[u];
          drawPort(ctx, px, uy + 60, used2 ? col(chainIdx2) : '#14120E', used2 ? chainIdx2 + 1 : 0);
        }
      }
    }

    if (detail === 'cabos') {
      const busY = wy + hPx + 8;
      ctx.strokeStyle = 'rgba(110,103,90,0.55)';
      ctx.setLineDash([5, 5]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(wallLeft - 8, busY); ctx.lineTo(wallRight + 8, busY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#4E483D'; ctx.font = '500 10px Consolas'; ctx.textAlign = 'left';
      ctx.fillText('calha de cabos rede 20m — main contínuo · backup tracejado', x0 + 20, busY + 14);
      for (let g = 0; g < d.chainsMain; g++) {
        const si = d.chainSec[g];
        const s = d.secs[si];
        const L = secLayout[si];
        const pos = wiringOrder(s.tw, s.th);
        const cInSec = g - chainsOffsetSig[si];
        const startIdx = cInSec * s.perSig;
        const tS = { x: L.x + pos[startIdx].col * tilePx + tilePx / 2, y: L.y + pos[startIdx].row * tilePx + tilePx / 2 };
        let u = 0;
        while (u < d.units - 1 && g >= chainStart[u + 1]) u++;
        const local = g - chainStart[u];
        const row = Math.floor(u / unitsPerRow);
        const rowUnits = Math.min(unitsPerRow, d.units - row * unitsPerRow);
        const rowW = rowUnits * (unitW + gapU) - gapU;
        const ux = (x0 + x1) / 2 - rowW / 2 + (u % unitsPerRow) * (unitW + gapU);
        const uy = wy + hPx + 30 + row * (unitH + gapU);
        const portRow = d.redun ? 0 : (local < halfPorts ? 0 : 1);
        const px = ux + unitW / 2 - gridW / 2 + 7.5 + (local % halfPorts) * 15;
        const py = uy + 44 + portRow * 16;
        ctx.strokeStyle = col(g);
        ctx.globalAlpha = 0.8; ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(px, py - 8);
        ctx.lineTo(px, busY);
        ctx.lineTo(tS.x, busY);
        ctx.lineTo(tS.x, tS.y + tilePx / 2);
        ctx.stroke();
        if (d.redun) {
          const endIdx = Math.min((cInSec + 1) * s.perSig, s.tt) - 1;
          const tE = { x: L.x + pos[endIdx].col * tilePx + tilePx / 2, y: L.y + pos[endIdx].row * tilePx + tilePx / 2 };
          ctx.globalAlpha = 0.6;
          ctx.setLineDash([4, 3]);
          ctx.beginPath();
          ctx.moveTo(px, py + 8);
          ctx.lineTo(px, busY + 6);
          ctx.lineTo(tE.x, busY + 6);
          ctx.lineTo(tE.x, tE.y + tilePx / 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.globalAlpha = 1;
      }
    }
  } else {
    // distribuição power vertical: QUADRO em cima, filas SOCA → POLVO → CE1..CE6 empilhadas
    const gap = 10;
    const baseY = wy + hPx + 26;
    const quadroX = x0 + 40;
    // quadro elétrico
    ctx.fillStyle = '#1B1915';
    ctx.fillRect(quadroX, baseY, 104, 64);
    ctx.strokeStyle = '#38342D'; ctx.lineWidth = 1; ctx.strokeRect(quadroX + 0.5, baseY + 0.5, 103, 63);
    ctx.fillStyle = '#4E483D'; ctx.font = '500 10px Consolas'; ctx.textAlign = 'center';
    ctx.fillText('QUADRO ELÉTRICO', quadroX + 52, baseY + 13);
    ctx.fillStyle = d.quadro ? '#E3A857' : '#C96A5A';
    ctx.font = '500 18px Consolas';
    ctx.fillText(d.quadro ? d.quadro + 'A' : '>125A', quadroX + 52, baseY + 33);
    ctx.fillStyle = '#8FAE8B'; ctx.font = '500 8.5px Consolas';
    ctx.fillText('L1 ' + d.phaseLoads[0].toFixed(1) + ' · L2 ' + d.phaseLoads[1].toFixed(1) + ' · L3 ' + d.phaseLoads[2].toFixed(1), quadroX + 52, baseY + 49);
    ctx.fillStyle = '#4E483D'; ctx.font = '500 8px Consolas';
    ctx.fillText('A/fase · máx 80%', quadroX + 52, baseY + 60);

    // filas por socapex
    const cePos = [];
    const rowY0 = baseY + 82;
    for (let s = 0; s < d.socapex; s++) {
      const ry = rowY0 + s * 40;
      const cs = [];
      d.assign.forEach((a, ci) => { if (a.polvo === s) cs.push({ ci, slot: a.slot, phase: a.phase }); });
      cs.sort((x, y) => x.slot - y.slot);
      // seta vertical do item anterior
      ctx.fillStyle = '#6E675A';
      ctx.font = '500 14px Consolas';
      ctx.textAlign = 'center';
      const arrY = (s === 0) ? baseY + 64 : ry - 6;
      const arrX = quadroX + 52;
      ctx.fillText('↓', arrX, arrY + (s === 0 ? 14 : 12));
      // soca
      let fx = x0 + 40;
      ctx.fillStyle = '#1B1915';
      ctx.fillRect(fx, ry, 54, 26);
      ctx.strokeStyle = '#38342D'; ctx.strokeRect(fx + 0.5, ry + 0.5, 53, 25);
      ctx.fillStyle = '#A99BB8'; ctx.font = '500 11px Consolas'; ctx.textAlign = 'center';
      ctx.fillText('SOCA ' + (s + 1), fx + 27, ry + 16);
      fx += 54 + gap;
      ctx.fillStyle = '#6E675A'; ctx.font = '500 14px Consolas';
      ctx.fillText('›', fx - gap / 2, ry + 16.5);
      // polvo
      ctx.fillStyle = '#1B1915';
      ctx.fillRect(fx, ry, 52, 26);
      ctx.strokeStyle = '#475569'; ctx.strokeRect(fx + 0.5, ry + 0.5, 51, 25);
      ctx.fillStyle = '#A99BB8'; ctx.font = '500 11px Consolas'; ctx.textAlign = 'center';
      ctx.fillText('POLVO ' + (s + 1), fx + 26, ry + 16);
      fx += 52 + gap;
      // chips CE
      cs.forEach((x, k) => {
        if (k > 0) {
          ctx.fillStyle = '#6E675A'; ctx.font = '500 14px Consolas'; ctx.textAlign = 'center';
          ctx.fillText('›', fx - gap / 2, ry + 15.5);
        }
        cePos[x.ci] = { x: fx, y: ry, w: 46, h: 22 };
        ctx.fillStyle = col(x.ci);
        ctx.fillRect(fx, ry + 2, 46, 22);
        ctx.fillStyle = '#1A1815'; ctx.font = '500 9px Consolas';
        ctx.fillText('CE ' + x.slot + '·L' + (x.phase + 1), fx + 23, ry + 15.5);
        fx += 46 + gap;
      });
    }

    if (detail === 'cabos') {
      const busY = wy + hPx + 8;
      ctx.strokeStyle = 'rgba(74,68,58,0.6)';
      ctx.setLineDash([5, 5]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(wallLeft - 8, busY); ctx.lineTo(wallRight + 8, busY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#4E483D'; ctx.font = '500 10px Consolas'; ctx.textAlign = 'left';
      ctx.fillText('calha PowerCon CE 10m', x0 + 20, busY + 14);
      let pIdx = 0;
      d.secs.forEach((s, si) => {
        const L = secLayout[si];
        const pos = wiringOrder(s.tw, s.th);
        for (let c = 0; c < s.chainsPwr; c++) {
          const g = pIdx++;
          const startIdx = c * s.perPwr;
          const t = { x: L.x + pos[startIdx].col * tilePx + tilePx / 2, y: L.y + pos[startIdx].row * tilePx + tilePx / 2 };
          const cp = cePos[g];
          ctx.strokeStyle = col(g);
          ctx.globalAlpha = 0.8;
          ctx.lineWidth = 1.4;
          ctx.setLineDash([4, 3]);
          ctx.beginPath();
          ctx.moveTo(cp.x + cp.w / 2, cp.y + 2);
          ctx.lineTo(cp.x + cp.w / 2, busY);
          ctx.lineTo(t.x, busY);
          ctx.lineTo(t.x, t.y + tilePx / 2);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }
      });
    }
  }

  ctx.restore();
}

function drawPort(ctx, x, y, fill, label) {
  ctx.fillStyle = fill;
  ctx.fillRect(x - 7, y - 7, 14, 14);
  ctx.strokeStyle = label ? 'rgba(26,24,21,0.5)' : '#4A443A';
  ctx.lineWidth = 1; ctx.strokeRect(x - 6.5, y - 6.5, 13, 13);
  if (label) {
    ctx.fillStyle = '#1A1815'; ctx.font = '500 8.5px Consolas'; ctx.textAlign = 'center';
    ctx.fillText(String(label), x, y + 0.5);
  }
}

function circleMarker(ctx, x, y, tilePx) {
  const r = Math.min(9, tilePx / 2 - 1);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#1A1815'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(231,226,214,0.85)'; ctx.lineWidth = 1; ctx.stroke();
}

function buildChips(d) {
  const cell = (cls, k, v) => '<span class="cell ' + cls + '"><span class="k">' + k + '</span><span class="v">' + v + '</span></span>';
  const secTxt = d.secs.map((s, i) => 'S' + (i + 1) + ':' + s.w + '×' + s.h).join(' · ');
  let html = cell('', 'Config', secTxt);
  html += cell('', 'Tiles', d.tt + ' un · ' + d.totals.caixas + ' caixas');
  html += cell('a', 'Sinal', d.portsMain + ' main + ' + d.portsBackup + ' bkup');
  html += cell('a', 'Unidades', d.units + '× ' + d.ctrl.name + ' · ' + d.tilesPerUnit.join('/') + ' t');
  if (d.capacityWarn) html += cell('r', 'Aviso', d.tt + ' > ' + d.units + '×' + d.ctrl.maxTiles);
  html += cell('g', 'Power', d.chainsPwr + ' circuitos CE · ' + d.socapex + ' soca · ' + d.polvos + ' polvo');
  if (d.warnOver16) html += cell('r', 'Aviso', d.maxCircuitAmps.toFixed(1) + ' A/circuito > 16A');
  html += cell('', 'Quadro', (d.quadro ? d.quadro + 'A' : '>125A') + ' · L1 ' + d.phaseLoads[0].toFixed(1) + ' / L2 ' + d.phaseLoads[1].toFixed(1) + ' / L3 ' + d.phaseLoads[2].toFixed(1) + ' A');
  html += cell('', 'Estrutura', d.totals.stacks + ' stacks · ' + d.totals.pesosCount + ' pesos · ' + d.totals.garras + ' garras');
  document.getElementById('chips').innerHTML = html;
}

function buildLegend(d) {
  const el = document.getElementById('legend');
  let html = '<span><span class="sw" style="background:#C96A5A"></span>cada secção S1..Sn · alinhadas pela base</span>';
  html += '<span><span class="sw" style="background:#7dd3fc"></span>cada cor + número = 1 circuito (coluna sobe / desce / sobe...)</span>';
  html += '<span><span class="sw" style="background:#1A1815"></span>○ início de circuito (main) — fim de circuito (backup)</span>';
  html += '<span>detalhe: ' + (detail === 'simples' ? 'Simples' : detail === 'completo' ? 'Setas' : 'Cabos') + '</span>';
  html += '<span>zoom: ' + Math.round(zoom * 100) + '% (arrastar para deslocar)</span>';
  el.innerHTML = html;
}

function buildBom(d) {
  const rows = [
    ['est', 'Tiles 500×500mm', d.tt + ' un', d.secs.map(s => s.tw + '×' + s.th).join(' + ') + ' (colunas × filas por secção)'],
    ['est', 'Caixas de tiles', d.totals.caixas + ' cx', '1 caixa = ' + d.brand.perBox + ' tiles · ' + d.brand.name],
    ['est', 'Frames de chão 50cm', d.totals.frames + ' un', '1 por coluna'],
    ['est', 'Stacks (1m)', d.totals.stacks + ' un', '1 por metro de altura × 1 por cada ' + CFG.stackEveryCols + ' colunas (mín. 1)'],
    ['est', 'Pesos 10kg', d.totals.pesosCount + ' un (' + (d.totals.pesosCount * 10) + ' kg)', '2 por metro de altura por stack (mín. 2)'],
    ['est', 'Garras', d.totals.garras + ' un', CFG.garrasPerStack + ' por stack'],
    ['sig', 'Cabos rede 20m', d.portsTotal + ' un', d.portsMain + ' main + ' + d.portsBackup + ' backup'],
    ['sig', 'Cabos rede link 70cm', d.tt + ' un', '1 por tile'],
    ['pwr', 'PowerCon CE 10m', d.chainsPwr + ' un', '1 por circuito de power (igual ao sinal · ' + d.maxCircuitAmps.toFixed(1) + 'A máx)'],
    ['pwr', 'Cabos link power 70cm', d.tt + ' un', '1 por tile'],
    ['dis', 'Socapex M/F', d.socapex + ' un', '1 por cada ' + CFG.circuitsPerSocapex + ' PowerCon CE'],
    ['dis', 'Polvos Socapex 6×CE', d.polvos + ' un', '1 por cada ' + CFG.circuitsPerSocapex + ' PowerCon CE'],
    ['dis', 'Quadro elétrico', d.quadro ? d.quadro + 'A' : '>125A (dividir)', 'L1 ' + d.phaseLoads[0].toFixed(1) + ' · L2 ' + d.phaseLoads[1].toFixed(1) + ' · L3 ' + d.phaseLoads[2].toFixed(1) + ' A/fase · margem 80%'],
    ['sig', 'Controladoras ' + d.ctrl.name, d.units + ' un', d.ctrl.ports + ' portas cada · distribuição ' + d.tilesPerUnit.join('/') + ' tiles']
  ];
  if (d.capacityWarn) rows.push(['sig', 'Capacidade excedida', '—', d.tt + ' tiles > ' + d.units + ' × ' + d.ctrl.maxTiles + ' tiles (rever!)']);
  if (d.warnOver16) rows.push(['pwr', '⚠ PowerCon acima de 16A', d.maxCircuitAmps.toFixed(1) + ' A/circuito', 'circuito igual ao sinal — verificar cabos CE']);
  document.getElementById('bom').innerHTML = rows.map(r =>
    '<tr><td><span class="tag ' + r[0] + '">' + ({est:'EST',sig:'SIN',pwr:'PWR',dis:'DIS'}[r[0]]) + '</span></td><td class="n">' + r[1] + '</td><td class="q">' + r[2] + '</td><td>' + r[3] + '</td></tr>').join('');
}

function captureCanvas(l) {
  const prev = layer;
  layer = l;
  draw();
  const url = document.getElementById('cv').toDataURL('image/png');
  layer = prev;
  draw();
  return url;
}

  pdf.setTextColor(110, 103, 90);

document.getElementById('brand').addEventListener('change', draw);
document.getElementById('ctrl').addEventListener('change', draw);
document.getElementById('redun').addEventListener('change', draw);
document.getElementById('zoom').addEventListener('input', function() { zoom = parseFloat(this.value); draw(); });

const cv = document.getElementById('cv');
let drag = null;
cv.style.cursor = 'grab';
cv.addEventListener('mousedown', function(e) { drag = { x: e.clientX, y: e.clientY, px: panX, py: panY }; cv.style.cursor = 'grabbing'; });
window.addEventListener('mousemove', function(e) {
  if (!drag) return;
  const rect = cv.getBoundingClientRect();
  panX = drag.px + (e.clientX - drag.x) * (cv.width / rect.width);
  panY = drag.py + (e.clientY - drag.y) * (cv.height / rect.height);
  draw();
});
window.addEventListener('mouseup', function() { drag = null; cv.style.cursor = 'grab'; });

renderSections();
setLayer('sig'); setDetail('simples');
draw();
