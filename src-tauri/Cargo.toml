[package]
name = "smart-led-calc"
version = "1.3.0"
description = "SmartChoice LED Calculator - calculadora de paineis LED para eventos"
authors = ["Nelson Teixeira"]
edition = "2021"

[lib]
name = "smart_led_calc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
